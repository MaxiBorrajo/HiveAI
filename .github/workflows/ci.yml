name: CI

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - "**.md"
      - ".claude/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - ".claude/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DENO_VERSION: "2.9.5"

jobs:
  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - name: Install dependencies
        run: deno install
      - name: Run tests
        run: deno task test

  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - name: Install dependencies
        run: deno install
      - name: Run tests
        run: deno task test
